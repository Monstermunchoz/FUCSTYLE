<!doctype html>
<html lang="fr">
<head>
{{HEAD}}
<title>Fucstyle – Biographie & Parcours Underground</title>
<meta name="description" content="Le parcours authentique du rappeur lyonnais Fucstyle, du SnakeS Crew à Bercail Records. Entre authenticité & indépendance.">
</head>
<body data-page="about">
<main>
  <header class="page-head">
    <div class="wrap"><h1 class="display">fucstyle</h1><div class="lead" data-intro style="margin-top:20px;color:rgba(255,255,255,.82)"></div></div>
  </header>
  <section class="section section--ink" style="padding-top:0"><div class="wrap"><div class="stats" data-stats></div></div></section>
  <section class="section">
    <div class="wrap bio">
      <div class="poster" style="--r:1.2deg"><img data-photo alt="Fucstyle" loading="lazy"></div>
      <div><h2 class="display" data-bio-title>FUCSTYLE</h2><p class="sub" data-bio-sub></p><div class="prose lead" data-text></div></div>
    </div>
  </section>
  <section class="section section--paper">
    <div class="wrap inde">
      <div><h2 class="display h-section">RAP INDé</h2><div class="prose" data-inde-text style="margin-top:24px"></div></div>
      <a class="bercail" href="https://bercailrecords.fr/" target="_blank" rel="noopener" aria-label="Bercail Records"><img src="https://fucstyle.fr/wp-content/uploads/2025/11/Bercail-Logotrans_1024.png" alt="Bercail Records" loading="lazy"></a>
    </div>
  </section>
  <section class="section">
    <div class="wrap"><div class="sec-head"><h2 class="display h-section">Discographie</h2></div><div class="discs" data-discs></div></div>
  </section>
  <section class="section section--paper">
    <div class="wrap"><div class="sec-head"><h2 class="display h-section">Sur scène</h2><a class="link-arrow" href="contact.html">Booking</a></div><ul class="dates" data-dates></ul></div>
  </section>
</main>
{{SCRIPTS}}
</body>
</html>
