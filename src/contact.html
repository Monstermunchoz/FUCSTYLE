<!doctype html>
<html lang="fr">
<head>
{{HEAD}}
<title>Contact Fucstyle – Booking, Partenariats & Demandes Pro</title>
<meta name="description" content="Contactez Fucstyle pour un booking, une collaboration ou une demande professionnelle.">
</head>
<body data-page="contact">
<main>
  <section class="section">
    <div class="wrap contact-layout">
      <div>
        <h1 class="display h-section" data-contact-title>Une question, une idée, une collab ?</h1>
        <p class="lead" data-contact-text style="margin-top:18px"></p>
        <p>Email direct : <a data-email class="link-arrow"></a></p>
        <div data-socials></div>
        <div data-contact-form style="margin-top:32px"></div>
      </div>
      <div class="poster contact-img" style="--r:1.4deg"><img data-contact-img alt="" loading="lazy"></div>
    </div>
  </section>
</main>
{{SCRIPTS}}
</body>
</html>
