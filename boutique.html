<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="https://fucstyle.fr/wp-content/uploads/2025/11/cropped-album__6_-removebg-preview-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Stencil+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<title>Boutique Fucstyle – Album, vinyles, merch | Fucstyle.fr</title>
<meta name="description" content="Découvrez la boutique officielle de Fucstyle : Album, T-shirts, vinyles, casquettes et pack collector dédicacé.">
</head>
<body data-page="shop">
<main>
  <header class="page-head">
    <div class="wrap">
      <h1 class="display">Shop</h1>
      <p data-banner></p>
    </div>
  </header>
  <section class="section">
    <div class="wrap">
      <div class="shop-bar">
        <div class="chips" data-chips></div>
        <div style="display:flex;gap:16px;align-items:center">
          <span class="muted" data-count></span>
          <label class="sr-only" for="sort">Trier</label>
          <select id="sort" class="select" data-sort>
            <option value="default">Mis en avant</option>
            <option value="asc">Prix croissant</option>
            <option value="desc">Prix décroissant</option>
          </select>
        </div>
      </div>
      <div class="products wall" data-products></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/posts.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
